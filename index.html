<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mixtape Mayhem</title><link rel="stylesheet" href="style.css"></head><body>
<div class="top"></div><div class="wrap"><div class="card"><h2>Join a game</h2><label>Game code (from the host screen)</label><input id="c" maxlength="5" placeholder="e.g. GKRW" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"><p id="err" style="color:#b00020;font-weight:700"></p>
<button class="s" onclick="go()">Get my card</button></div>
<div class="card"><h3>Hosting?</h3><button class="s" style="background:var(--navy)" onclick="location='host.html'">Open host screen</button></div></div>
<script src="logo.js"></script><script>function go(){const c=document.getElementById('c').value.replace(/\s/g,'').toUpperCase();if(!c)return;
// host codes are 4 letters (Today's Hits), D + 4 (Decades) or T + 4 (Tailgate), never I or O
if(!/^[DT]?[A-HJ-NP-Z]{4}$/.test(c))return err.textContent='Check the code from the host: 4 letters, or 5 letters starting with D or T.';location='play.html?g='+encodeURIComponent(c)}</script></body></html>
